plugins {
    id("java")
    id("application")
    id("org.beryx.jlink") version "3.0.1"
    id("org.openjfx.javafxplugin") version "0.1.0"
    id("maven-publish")
    id("signing")
}

group = "one.empty3"
version = "2023.1"

repositories {
    mavenCentral()
    google()
    maven {
        url = uri("https://www.jetbrains.com/intellij-repository/releases")
    }
    maven {
        url = uri("https://packages.jetbrains.team/maven/p/ij/intellij-dependencies")
    }
    flatDir {
        dirs "${rootDir}/lib", "${rootDir}/lib0", "${rootDir}/javafx-sdk-19.0.2.1/lib"
    }
}

javafx {
    version = "19.0.2.1"
    modules = ["javafx.controls", "javafx.fxml", "javafx.graphics", "javafx.media", "javafx.swing", "javafx.web", "javafx.base"]
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withJavadocJar()
    withSourcesJar()
}

application {
    mainModule.set("one_empty3_apps_mylittlesynth")
    mainClass.set("one.empty3.apps.mylittlesynth.App")
}

dependencies {
    implementation("org.controlsfx:controlsfx:11.2.1")
    implementation("com.dlsc.formsfx:formsfx-core:11.6.0")
    implementation("net.synedra:validatorfx:0.6.1")
    implementation("org.kordamp.ikonli:ikonli-javafx:12.3.1")
    implementation("org.kordamp.bootstrapfx:bootstrapfx-core:0.4.0")
    implementation("eu.hansolo:tilesfx:21.0.9")
    implementation("com.github.almasb:fxgl:11.17")

    implementation("org.apache.servicemix.bundles:org.apache.servicemix.bundles.jdom:2.0.6.1_1")
    testImplementation("junit:junit:4.13.2")
    testImplementation('org.junit.jupiter:junit-jupiter-api:5.9.0')
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.9.0')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.9.0')
    implementation 'com.jetbrains.intellij.java:java-gui-forms-rt:203.7148.30'
    implementation("com.miglayout:miglayout-swing:11.0")
    implementation("com.miglayout:miglayout-javafx:11.0")
    implementation("com.miglayout:miglayout-core:11.0")
}

jlink {
    imageZip.set(layout.buildDirectory.file("distributions/app-${javafx.platform.classifier}.zip"))
    options.set(['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages'])
    launcher {
        name = "app"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

sourceSets {
    main {
        resources {
            srcDirs "src/main/resources", "src/main/configs", "src/main/java"
        }
    }
}

Properties properties = new Properties()
try {
    File propertiesFile = new File(rootProject.projectDir, '../private.properties/gradle.properties')
    if (propertiesFile.exists()) {
        propertiesFile.withInputStream {
            properties.load(it)
        }
    }
} catch (Exception ex) {
    ex.printStackTrace()
}

task runNewAppGui(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    modularity.inferModulePath.set(true)
    mainModule = "one_empty3_apps_mylittlesynth"
    mainClass = "one.empty3.apps.mylittlesynth.AppNew"
    args "arg1", "arg2"
}

task runAppGui(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    modularity.inferModulePath.set(true)
    mainModule = "one_empty3_apps_mylittlesynth"
    mainClass = "one.empty3.apps.mylittlesynth.App"
    args "arg1", "arg2"
}

signing {
    required { gradle.taskGraph.hasTask("publish") && properties.containsKey("signing.keyId") }
    def signingKey = properties.get("signing.keyId")
    if (signingKey != null) {
        useGpgCmd()
        sign publishing.publications
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task copyTask(type: Copy) {
    from 'src/main/java/*.properties'
    into 'build/classes/java/main'
}

javadoc {
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

test {
    useJUnitPlatform()
    testLogging.showStandardStreams = true
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'one.empty3'
            artifactId = 'mylittlesynth'
            version = "2023.1"
            from components.java

            pom {
                name = 'mylittlesynth'
                description = 'basic notes and repeated sounds'
                packaging = 'jar'
                url = "https://github.com/manuelddahmen/mylittlesynth"

                licenses {
                    license {
                        name = "Apache version 2"
                        url = "https://www.apache.org/licenses/LICENSE-2.0"
                        distribution = "repo"
                    }
                }

                scm {
                    url = "https://github.com/manuelddahmen/mylittlesynth"
                    connection = "scm:git:https://github.com/manuelddahmen/mylittlesynth.git"
                    developerConnection = "scm:git:https://github.com/manuelddahmen/mylittlesynth.git"
                }

                developers {
                    developer {
                        email = "dathewolf@gmail.com"
                        name = "Manuel Daniel Dahmen"
                        url = "https://github.com/manuelddahmen"
                        id = "manuelddahmen"
                    }
                }
            }
        }
    }
}
