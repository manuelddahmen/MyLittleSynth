    args "arg1", "arg2"
}

task runAppGui(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "one.empty3.apps.mylittlesynth.App"
    args "arg1", "arg2"
}

signing {
    try {
        def signingKey = load.get("signing.keyId")
        def signingPassword = load.get("signing.password")
        useGpgCmd()
    } catch (Exception e) {
        // Ignorer les erreurs de signature si les clés ne sont pas disponibles
        logger.warn("Signature configuration is not complete, skipping signing: ${e.message}")
    }
}


tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task copyTask(type: Copy) {
    from 'src/main/java/*.properties'
    into 'build/classes/java/main'
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'one.empty3'
            artifactId = 'mylittlesynth'
            version = versionName
            from components.java

            pom {
                name = 'mylittlesynth'
                description = 'basic notes and repeated sounds'
                packaging = 'jar'
                url = "https://github.com/manuelddahmen/mylittlesynth"
                version = versionName
                licenses {
                    license {
                        name = "Apache version 2"
                        url = "https://www.apache.org/licenses/LICENSE-2.0"
                        distribution = "repo"
                    }
                }

                scm {
                    url = "https://github.com/manuelddahmen/mylittlesynth"
                    connection = "scm:git:https://github.com/manuelddahmen/mylittlesynth.git"
                    developerConnection = "scm:git:https://github.com/manuelddahmen/mylittlesynth.git"
                }

                developers {
                    developer {
                        email = "dathewolf@gmail.com"
                        name = "Manuel Daniel Dahmen"
                        url = "https://github.com/manuelddahmen"
                        id = "manuelddahmen"
                    }
                }
            }
        }
    }
    repositories {
        maven {
            url = layout.buildDirectory.dir('staging-deploy')
        }

    }
}


        test {
    useJUnitPlatform()

    // Ne pas échouer s'il n'y a pas de tests
    // onlyIf {
    //     project.hasProperty('runTests')
    //  }

    // Exclude xmlsec from test classpath: it's a named module that requires
    // jakarta.xml.bind at boot layer init but is not used in any test code
    classpath = classpath.filter { !it.name.contains('xmlsec') }

    // Allow JUnit to instantiate test classes in one.empty3 package via reflection and prevent IllegalAccessError across packages
    jvmArgs '--add-opens=empty3_library_mp/one.empty3=ALL-UNNAMED,org.junit.platform.commons',
            '--add-opens=empty3_library_mp/one.empty3.testagentcode=ALL-UNNAMED,org.junit.platform.commons',
            '--add-opens=empty3_library_mp/one.empty3.library1.tree=ALL-UNNAMED,org.junit.platform.commons',
            '--add-opens=empty3_library_mp/one.empty3.library=ALL-UNNAMED,org.junit.platform.commons',
            '--add-opens=empty3_library_mp/one.empty3.library1.shader=ALL-UNNAMED,org.junit.platform.commons'

    testLogging {
        events "passed", "skipped", "failed"
        showExceptions true
        exceptionFormat "short"
    }
}

tasks.named('compileKotlin').configure {
    destinationDirectory.set(sourceSets.main.java.destinationDirectory)
}

tasks.named('compileTestKotlin').configure {
    destinationDirectory.set(sourceSets.test.java.destinationDirectory)
}

tasks.configureEach { task ->
    if (task.class.name.contains('JReleaser')) {
        if (task.hasProperty('outputDirectory')) {
            task.outputDirectory = layout.buildDirectory.dir("jreleaser-out")
        }
    }
}

jreleaser {
    signing {

        active = 'ALWAYS'
        armored = true
        mode = 'FILE'
        //publicKey = load.get('signing.publicKeyPath')
        passphrase = load.get('signing.passphrase')
        def secretKeyPath = load.get('signing.secretKey')
        if (secretKeyPath) {
            File skFile = new File(secretKeyPath as String)
            secretKey = skFile.isAbsolute() ? secretKeyPath : new File(System.getProperty('user.home'), secretKeyPath).absolutePath
        }
    }
    release {
        github {
            token = load.get('release.github.token')
        }
    }
    project {
        name = 'mylittlesynth'
        java.artifactId = 'mylittlesynth'
        java.groupId = 'one.empty3'
        java.version = versionName
        version = versionName
        license = 'Apache-2.0'
        authors = ['Manuel D DAHMEN']
        description = '3D rendering engine. Plus modelling. Expected glsl-like textures 3d and rendering' +
                '3D primitives, and a lot of scenes\' samples to test.' +
                '+ Game Jogl reworked, Calculator (numbers and vectors). Java code parser implementation starts (<=1.2)'
        copyright = "Author : Manuel D. Dahmen, License: Apache-2"
        icon {
            // Publicly available URL. PNG format is preferred.
            //
            url = 'https://empty3.one/favicon.ico'
            // Marks this icon as the primary one.
            // Only a single icon may be set as primary.
            //
            primary = true
            // Image width in pixels.
            //
            width = 47
            // Image height in pixels.
            //
            height = 47
        }
    }

    deploy {
        maven {
            // Enable or disable all configured deployers.
            // Supported values are [`NEVER`, `ALWAYS`, `RELEASE`, `SNAPSHOT`].
            // Defaults to `ALWAYS`.
            //
            active = 'ALWAYS'
            pomchecker {
                // Defines the tool version to use.
                //
                version = '1.11.0'

                // Fail the release if pomchecker outputs a warning.
                // Defaults to `true`.
                //
                failOnWarning = false

                // Fail the release if pomchecker outputs an error.
                // Defaults to `true`.
                //
                failOnError = false
            }
            mavenCentral {
                app {
                    active = 'ALWAYS'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    gitRootSearch = false
                    username = propertiesReleaseConfig.get('JRELEASER_MAVENCENTRAL_USERNAME')
                    password = propertiesReleaseConfig.get('JRELEASER_MAVENCENTRAL_PASSWORD')
                    authorization = 'BASIC'
                    // Password for login into the MAVENCENTRAL service.
                    //
                    // List of directories where staged artifacts can be found.
                    stagingRepository('build/staging-deploy')

                    // Defines the connection timeout in seconds.
                    // Defaults to `20`.
                    //
                    connectTimeout = 20

                    // Defines the read timeout in seconds.
                    // Defaults to `60`.
                    //
                    readTimeout = 60


                    // Registered publication namespace.
                    // Defaults to `${project.java.groupId}`.
                    //
                    namespace = 'one.empty3'

                    // Deployment identifier used for publication.
                    //
                    deploymentId = 'd54226c8-5abd-4679-bc76-451c3ae38bfb'//27d4cb92-0141-4a3f-b2e1-38c801bfafb0'

                    // Time to wait between state transition checks, in seconds.
                    // Defaults to `10`.
                    //
                    retryDelay = 10

                    // Maximum number of attempts to verify state transition.
                    // Defaults to `60`.
                    //
                    maxRetries = 120
                }
            }
        }
    }
    upload {
        // Enable or disable all configured uploaders.
        // Supported values are [`NEVER`, `ALWAYS`, `RELEASE`, `SNAPSHOT`].
        // Defaults to `ALWAYS`.
        //
        active = 'ALWAYS'
    }
}

